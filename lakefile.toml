name = "FormalMathCourseRepo2026"
defaultTargets = ["ImperialCollegeExercises", "ProblemSets", "Demo"]

# One Lean and one Mathlib for the whole course. The toolchain is in
# `lean-toolchain`; `lake-manifest.json` pins Mathlib's own dependencies.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0-rc2"

# Imperial College London's 2026 exercise sheets bumped to the course's
# version of Lean and Mathlib. A glob rather than a root module, because
# there is no `ImperialCollegeExercises.lean`.
# The original repository on version v4.26.0 is:
# <https://github.com/b-mehta/formalising-mathematics-notes>
[[lean_lib]]
name = "ImperialCollegeExercises"
globs = ["ImperialCollegeExercises.+"]

# The course's own homework problem sets.
[[lean_lib]]
name = "ProblemSets"
globs = ["ProblemSets.+"]

# Various Lean demonstrations during the course.
[[lean_lib]]
name = "Demo"
globs = ["Demo.+"]
